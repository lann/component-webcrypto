name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Native Rust checks: formatting, lints, WIT validation, and the
  # guest-under-Wasmtime integration test.
  rust-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        # The toolchain version, wasm target, and rustfmt/clippy components are
        # pinned in rust-toolchain.toml; `rustup show` installs exactly those.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
          cache-all-crates: true

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The whole job body lives in the justfile (`rust-checks`): formatting,
      # WIT validation, clippy, Rust tests (including the guest-under-Wasmtime
      # integration test), the composed fully in-guest demo, and the
      # cross-implementation conformance suite. The justfile's `_step` wrapper
      # emits ::group::/::error:: annotations per recipe.
      - name: Run rust checks
        run: just rust-checks

  # The webcrypto-componentize JS guest library's gates: the composed demo
  # (the JS guest's checks against the in-guest provider, including the
  # extension-error transport the WPT suites cannot observe) and the WPT
  # WebCryptoAPI suites. Both componentize from the tree with the pinned
  # componentize-js (downloaded — see the componentize-js-toolchain
  # workflow), compose with a freshly built in-guest provider and driver,
  # and run under wasmtime. Componentizing takes seconds, so the guests are
  # always built from the tree under test.
  componentize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: componentize
          cache-all-crates: true

      - name: Install dependencies
        run: ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKIP_NODE: "1"

      - name: Run the componentize checks
        run: just componentize-checks

  # Guest component build + jco (Web Crypto) host test. jco's async ABI uses
  # JSPI, which Node exposes behind --experimental-wasm-jspi from 24 on.
  jco:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: jco
          cache-all-crates: true

      - name: Install dependencies
        run: ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache Playwright browsers
        # The browser downloads dominate the install step (~35s); the cache
        # key follows the parity package's lockfile, which pins
        # playwright-core and with it the browser builds. restore-keys lets
        # a lockfile bump start from the previous browsers and download
        # only what changed.
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('js/componentize/wpt/parity/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        # The browser WPT parity gates' engines: Playwright's pinned builds
        # (Firefox launched with Gecko's JSPI pref; Chromium ships JSPI), so
        # the loss sets in losses-firefox.js and losses-chromium.js measure
        # one engine each, everywhere. On a cache hit the install only
        # verifies the browsers are present; --with-deps (an apt run) is
        # needed only when the browsers were actually (re)downloaded.
        run: |
          cd js/componentize/wpt/parity
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright-core install firefox chromium
          else
            npx playwright-core install --with-deps firefox chromium
          fi

      - name: Run the jco host checks
        run: just jco-checks

  # The WebKit WPT parity gate runs on macOS: Playwright's WebKit there
  # uses Apple's crypto backend — the closest CI proxy for mobile Safari —
  # where the Linux port (libgcrypt) serves less and crashes under this
  # workload. No componentize-js toolchain is published for darwin, so the
  # page artifacts are built on ubuntu and handed over.
  wpt-parity-webkit-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Install the parity package's dependencies
        run: cd js/componentize/wpt/parity && npm ci --no-audit --no-fund

      - name: Build the parity page artifacts
        run: just wpt-web-artifacts

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpt-web-artifacts
          path: |
            js/componentize/wpt/parity/generated-web/**
            js/componentize/wpt/build/group-*.js
            js/componentize/wpt/web/preview2-shim/**

  wpt-parity-webkit:
    needs: wpt-parity-webkit-artifacts
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install just
        run: brew install just

      - name: Download the parity page artifacts
        uses: actions/download-artifact@v4
        with:
          name: wpt-web-artifacts
          path: js/componentize/wpt

      - name: Cache Playwright WebKit
        # Same scheme as the jco job's browser cache (macOS cache path).
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('js/componentize/wpt/parity/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install the parity package + Playwright WebKit
        run: |
          cd js/componentize/wpt/parity
          npm ci --no-audit --no-fund
          npx playwright-core install webkit

      - name: Run the WebKit WPT parity gate
        run: just wpt-parity-webkit
