name: pages

# Publish the Pages site: the browser WPT parity page
# (js/componentize/wpt/web/) and the public crates' API docs. Builds the
# WPT page's artifacts and the rustdoc, then deploys the site assembled by
# `just gha::pages-site`. (The incumbent conformance results viewer was
# retired at the M1.6 cutover; the component-test matrix is the committed
# conformance/driver-ct/matrix.md.)
# The pages' URLs are all relative, so they serve correctly from the
# project subpath.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout component-test (path dependency)
        # The conformance ct crates path-depend on a sibling checkout of
        # lann/component-test (see conformance/driver-ct/justfile).
        # TODO: pin to a released component-test ref instead of the
        # default branch.
        run: git clone --depth 1 https://github.com/lann/component-test ../component-test

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
          cache-all-crates: true
          # The CI workflow owns this cache; this job only reads it.
          save-if: false

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the WPT parity page artifacts
        run: just wpt::web-artifacts

      - name: Assemble the static site
        run: just gha::pages-site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/conformance-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
