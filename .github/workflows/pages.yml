name: pages

# Publish the Pages site: the browser WPT parity page
# (js/componentize/wpt/web/) and the public crates' API docs. Builds the
# WPT page's artifacts and the rustdoc, then deploys the site assembled by
# `just gha::pages-site`. (The incumbent conformance results viewer was
# retired at the M1.6 cutover; the component-test matrix is the committed
# conformance/driver-ct/matrix.md.)
# The pages' URLs are all relative, so they serve correctly from the
# project subpath.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
          cache-all-crates: true
          # The CI workflow owns this cache; this job only reads it.
          save-if: false

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the WPT parity page artifacts
        run: just wpt::web-artifacts

      - name: Build the conformance viewer artifacts
        # component-test's results viewer staged at the pin, plus the
        # transpiled suites its live pane runs (conformance-ct's
        # _jco-prepared dependency builds them).
        run: just conformance-ct::_viewer-prepared

      - name: Fetch the latest conformance results (best effort)
        # The viewer's results pane data: the conformance-results
        # artifact of the newest successful CI run on main. Absent
        # (expired retention, API hiccup), the page still serves — the
        # file inputs and the live run are self-contained.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" -q '.workflow_runs[0].id' || true)
          if [ -n "$run_id" ]; then
            gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n conformance-results \
              -D conformance/driver-ct/results/ \
              && echo "staged results from CI run $run_id" \
              || echo "no conformance-results artifact on run $run_id; publishing without results"
          else
            echo "no successful CI run found; publishing without results"
          fi

      - name: Assemble the static site
        run: just gha::pages-site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/conformance-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
