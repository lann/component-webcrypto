name: Weekly lab

# The weekly analyses that are too expensive or too statistical to gate pull
# requests: the dudect-style timing lab (timing-lab/README.md) measured
# against the composed in-guest provider, and mutation testing of the shared
# crypto core and Wasmtime host (`just mutants`) against the unit tests plus
# both conformance suites.
#
# Deliberately schedule-only: the lab is a statistical experiment on a shared
# runner, so it cannot gate pull requests without flaking them, and a full
# mutation run costs hours. They run on their own cadence instead, and a
# scheduled run that fails notifies rather than blocking.
# `continue-on-error` would be the wrong shape here — a job nobody is told
# about is a job that rots, which is the state this replaces.
on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      samples:
        description: "Samples per class per surface (higher = more sensitive, slower)"
        required: false
        default: "2000"

permissions:
  contents: read

concurrency:
  group: weekly-lab
  cancel-in-progress: false

jobs:
  timing-lab:
    # Scheduled workflows run in forks too, where this measures nothing
    # anyone reads.
    if: github.repository == 'lann/component-webcrypto'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout component-test (path dependency)
        # The conformance ct crates path-depend on a sibling checkout of
        # lann/component-test (see conformance/driver-ct/justfile).
        # TODO: pin to a released component-test ref instead of the
        # default branch.
        run: git clone --depth 1 https://github.com/lann/component-test ../component-test

      - name: Install Rust toolchain
        # The toolchain version, wasm target, and components are pinned in
        # rust-toolchain.toml; `rustup show` installs exactly those.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: timing-lab
          cache-all-crates: true

      - name: Install dependencies
        # The lab needs wasmtime and wac; nothing here touches Node.
        run: ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKIP_NODE: "1"

      - name: Run the timing lab
        run: just gha::timing-lab-scheduled
        env:
          TIMING_LAB_SAMPLES: ${{ inputs.samples || '2000' }}

  # Mutation testing: cargo-mutants over lann-webcrypto-core and lann-webcrypto-wasmtime, oracle =
  # their unit tests + both conformance suites through the ct driver's
  # env-gated oracle test. A missed mutant fails the job: it is a change to
  # the crypto that no suite distinguishes — exactly the assertion-strength
  # gap the lockfiles cannot pin (they pin the case inventory, not what the
  # cases check).
  #
  # The run is sharded across parallel jobs (`cargo mutants --shard` via the
  # recipe's argument): the per-mutant cost is irreducible single-threaded
  # oracle time, so wall clock only scales with machines. Each shard pays
  # its own setup and baseline and writes its own summary section and
  # artifact; growing the shard count is the lever if the mutant count
  # outgrows the timeout below.
  mutants:
    if: github.repository == 'lann/component-webcrypto'
    runs-on: ubuntu-latest
    strategy:
      # One shard's missed mutants must not cancel the others: the weekly
      # verdict is the union of all shards' findings.
      fail-fast: false
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout component-test (path dependency)
        # The conformance ct crates path-depend on a sibling checkout of
        # lann/component-test (see conformance/driver-ct/justfile).
        # TODO: pin to a released component-test ref instead of the
        # default branch.
        run: git clone --depth 1 https://github.com/lann/component-test ../component-test

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
          cache-all-crates: true

      - name: Install dependencies
        # wasm-tools for the guest-component builds; nothing here touches Node.
        run: ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKIP_NODE: "1"

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run mutation testing
        run: just mutants ${{ matrix.shard }}

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Mutation testing (shard ${{ matrix.shard }})"
            echo
            if [ -f mutants.out/missed.txt ] && [ -s mutants.out/missed.txt ]; then
              echo "**Missed mutants (changes to the crypto no suite distinguishes):**"
              echo
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
            elif [ -f mutants.out/missed.txt ]; then
              echo "No missed mutants."
            else
              echo "The run did not produce mutants.out (it failed before testing)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out-${{ strategy.job-index }}
          path: mutants.out/
          if-no-files-found: ignore
