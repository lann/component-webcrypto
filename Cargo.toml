[workspace]
members = [
    "rust/core",
    "rust/guest",
    "rust/wasmtime",
    "rust/guest-provider",
    "examples/crypto-demo",
    "examples/demo-driver",
    "examples/wasmtime-demo",
    "conformance/harness",
    "conformance/guest-ct",
    "conformance/driver-ct",
    "conformance/signing-guest-ct",
    "timing-lab",
]
resolver = "2"

# The polymorph:test stack, pinned by git rev (bump deliberately:
# update the rev here, `cargo update -p component-test-sdk -p
# component-test-runner`, `npm install --save-exact
# github:polymorph-components/polymorph-test#<rev>` in
# conformance/driver-ct/jco, and move the actions/aggregate refs in
# .github/workflows/ci.yml — the pins gate and the CI ref guard fail
# on skew; the CI tools cache and the ct/ct-runner binaries key off
# the locked rev). To develop against a local checkout, add a `[patch]`
# override — see AGENTS.md "Build & run". Publishing component-test
# to a registry retires this arrangement.
[workspace.dependencies]
component-test-sdk = { git = "https://github.com/polymorph-components/polymorph-test", rev = "824d100349dc7804c9bf1723d9b1ba0ed40fa940" }
component-test-runner = { git = "https://github.com/polymorph-components/polymorph-test", rev = "824d100349dc7804c9bf1723d9b1ba0ed40fa940" }

# The mutation run's profile (`just mutants`): dependencies optimized —
# wasmtime and the RustCrypto cores are compiled once, at baseline, and make
# the conformance-oracle runs near release speed — while workspace members
# stay unoptimized, so the per-mutant rebuild of the mutated crate and its
# dependents stays cheap. (`package."*"` matches dependencies only, not
# workspace members.)
[profile.mutants]
inherits = "dev"

[profile.mutants.package."*"]
opt-level = 2
