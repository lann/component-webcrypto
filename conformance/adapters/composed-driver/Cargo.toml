[package]
name = "conformance-composed-driver"
version = "0.1.0"
edition = "2021"
publish = false
description = "CLI driver component for the composed conformance target: imports conformance:webcrypto/tests, exports an async wasi:cli/run, and prints the results JSON on stdout."

[lib]
crate-type = ["cdylib"]

[dependencies]
# The async `wasi:cli/run` export.
wasip3 = { version = "0.7", features = ["async-spawn"] }
# Pinned to the wit-bindgen version the `wasip3` crate uses (see
# examples/demo-driver).
wit-bindgen = { version = "0.57", features = ["async", "async-spawn"] }
# The results-file wire shapes, shared with the wasmtime adapter and the
# runner (data types only, so they compile to wasm32-wasip2).
conformance-report = { path = "../../report" }
serde_json = "1"
