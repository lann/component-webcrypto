# The host-only signing suite: the host-backed targets (wasmtime,
# jco-node) — the composed target cannot even link its world (ecdsa-sign
# is class D). ecdsa-sign is
# structural and untagged; the gated RSA features (rsa-sign,
# rsa-oaep-decrypt) tag the suite's RSA vector cases and probes, with a
# !feature decline case each proving the refusal on targets declaring
# them missing.
version = "0.1"

[features.ecdsa-sign]
kind = "structural"

[features.rsa-sign]
kind = "gated"

[features.rsa-oaep-decrypt]
kind = "gated"

[targets.wasmtime-rustcrypto]
missing-features = []

[targets.jco-node]
# Node's WebCrypto serves the gated RSA private-key mints by default —
# the fail-closed rsa-sign/rsa-oaep-decrypt posture is a browser policy
# (jco-browser), not Node's.
missing-features = []
