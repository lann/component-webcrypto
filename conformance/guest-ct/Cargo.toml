[package]
name = "conformance-guest-ct"
version = "0.1.0"
edition = "2021"
publish = false
description = "The conformance suite ported onto the lann:component-test guest SDK (M1.5): same corpus and case ids as conformance-guest, exported through the frozen tests contract, with the decline branch restructured into explicit !feature decline cases."
build = "build.rs"

[features]
# Measurement experiment: pre-parse the vector JSON at build time
# (build.rs runs the translate iterators and serializes each corpus with
# postcard); plan.rs then decodes the blobs instead of re-parsing JSON at
# registry-build time. Off by default; behavior-identical corpus.
preparsed = ["dep:postcard"]
# Measurement experiment, step two: archive each corpus with rkyv at
# build time (ids and feature indices precomputed natively) and access
# it zero-copy at registry build; each case deserializes itself only
# when it runs. Mutually exclusive with `preparsed`.
rkyv-corpus = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The port target: the component-test guest SDK (path-dep against the
# component-test checkout during the migration).
component-test-sdk = { path = "../../../component-test/crates/component-test-sdk" }
# The #[suite] macro expands a wit_bindgen::generate! naming this crate.
# 0.60 (what the SDK is developed against); the SUT bindings below keep
# their own 0.59 via lann-webcrypto-guest — disjoint packages, merged at
# wasm-component-ld.
wit-bindgen = { version = "0.60", features = ["async"] }

# Everything below mirrors conformance-guest: the incumbent case bodies
# are reused wholesale (see src/lib.rs).
lann-webcrypto-guest = { path = "../../rust/guest", features = ["sha1-checked"] }
conformance-harness = { path = "../harness" }
futures = { version = "0.3", default-features = false, features = ["async-await", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
postcard = { version = "1", features = ["alloc"], optional = true }
# Not optional: the crate compiles translate.rs (whose case types carry
# the rkyv derives) in every mode; `rkyv-corpus` only switches the
# corpus source.
rkyv = "0.8"

# build.rs (under the `preparsed` feature) runs the same translate.rs the
# crate itself #[path]-includes, so it needs the module's dependencies
# natively.
[build-dependencies]
conformance-harness = { path = "../harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
postcard = { version = "1", features = ["alloc"] }
rkyv = "0.8"
