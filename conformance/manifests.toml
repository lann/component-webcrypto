# Per-target expectations for the conformance corpus.
#
# Each target lists test ids (or id prefixes ending in `*`) it is EXPECTED to
# fail, with a reason. The runner classifies results as pass, fail,
# expected-fail, or unexpected-pass (an expected failure that passed —
# treated as an error so stale entries get pruned). Expectations here encode
# *policy* divergence (e.g. a future FIPS-profile target expected-failing the
# short-key HMAC vectors), not bugs: bugs get fixed, not manifested.

[targets.wasmtime]
expected-fail = []

[targets.composed]
expected-fail = []

# The jco-node target is gating everywhere (part of `just conformance`).
# jco-browser gates in CI (the Actions runner ships Chrome); locally it needs
# a Chrome/Chromium install and runs only when opted in with
# CONFORMANCE_BROWSER=1, so the runner warns rather than fails on a missing
# results file.

# Browser WebCrypto implements no ChaCha20-Poly1305 (the WICG proposal is
# unimplemented), so the jco host declines both `chacha-variant`s as
# `unsupported`: every ChaCha20-Poly1305 vector case and probe fails at key
# minting. This is policy, not a bug — a composition needing ChaCha on this
# target must supply another provider.
[targets.jco-node]
expected-fail = [
    "chacha20-poly1305/*",
    "xchacha20-poly1305/*",
    "xchacha20-poly1305-internal-nonce/*",
    "probe/chacha-*",
    # WebCrypto signs ECDSA with a randomized k (RFC 6979's deterministic k
    # is unobservable there), so the deterministic known-answer probe from
    # the host-only signing guest cannot pass. The signatures still verify;
    # only exact-bytes reproduction differs.
    "probe/ecdsa-sign-deterministic-rfc6979",
]

[targets.jco-browser]
expected-fail = [
    "chacha20-poly1305/*",
    "xchacha20-poly1305/*",
    "xchacha20-poly1305-internal-nonce/*",
    "probe/chacha-*",
    "probe/ecdsa-sign-deterministic-rfc6979",
]
