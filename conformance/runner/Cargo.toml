[package]
name = "conformance-runner"
version = "0.1.0"
edition = "2021"
publish = false
description = "Aggregates per-target conformance results against targets.toml and the suite lockfiles; renders conformance/matrix.md and the results-viewer JSON."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The results-file and lockfile wire shapes, shared with the adapters.
conformance-report = { path = "../report", features = ["lock"] }
# The lockfile is one structure: name -> tags in suite order. Two parallel
# structures (a map plus an order vector) were one more way to desynchronize.
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
