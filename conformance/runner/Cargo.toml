[package]
name = "conformance-runner"
version = "0.1.0"
edition = "2021"
publish = false
description = "Classifies per-target conformance results against manifests.toml and renders conformance/matrix.md."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
