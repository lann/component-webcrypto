[package]
name = "conformance-signing-guest-ct"
version = "0.1.0"
edition = "2021"
publish = false
description = "The host-only signing conformance suite ported onto the lann:component-test guest SDK: same probe bodies and case ids as conformance-signing-guest, exported through the frozen tests contract."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The port target: the component-test guest SDK (path-dep against the
# component-test checkout during the migration).
component-test-sdk = { path = "../../../component-test/crates/component-test-sdk" }
# The #[suite] macro expands a wit_bindgen::generate! naming this crate.
# 0.60 (what the SDK is developed against); the SUT bindings keep their
# own 0.59 via lann-webcrypto-guest — disjoint packages, merged at
# wasm-component-ld.
wit-bindgen = { version = "0.60", features = ["async"] }

# Everything below mirrors conformance-signing-guest: the incumbent probe
# bodies are reused wholesale (see src/probes.rs).
lann-webcrypto-guest = { path = "../../rust/guest" }
conformance-harness = { path = "../harness" }
futures = { version = "0.3", default-features = false, features = ["async-await"] }
