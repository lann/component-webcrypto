[package]
name = "conformance-signing-guest"
version = "0.1.0"
edition = "2021"
publish = false
description = "The host-only conformance guest: cases for signature-minting interfaces the in-guest provider deliberately does not export (ecdsa-sign, the gated RSA signing interfaces), runnable only under the host-backed targets."

[lib]
crate-type = ["cdylib"]

[dependencies]
# The lann:webcrypto bindings and stream helpers; carries the imports, so
# this component's own world declares only its export. `rsa-sign` adds the
# gated RSA signing imports to the generated world — this guest, like the
# `ecdsa-sign` import it exists for, runs only under the host-backed
# targets, so the composed target's linking is not implicated.
lann-webcrypto-guest = { path = "../../rust/guest", features = ["rsa-sign"] }
# The world-independent half of the guest, shared with the shared-suite
# guest: probe table, error rendering, missing-feature validation.
conformance-harness = { path = "../harness" }
wit-bindgen = { version = "0.59", features = ["async"] }
futures = { version = "0.3", default-features = false, features = ["async-await"] }
# Parsing the vendored Wycheproof sig-gen JSON compiled into the guest.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
