# The conformance suites and targets: facts about the test sets and the
# implementations under test.
#
# Expectation policy lives in the cases themselves — each case declares the
# `features` it exercises, and a case whose feature a target declares in
# `missing-features` reports `skipped`. This file carries only what has
# no other home: which suites and targets exist, which features each
# target is missing (and why), and whether a target's missing results file
# is an error.
#
# A declarable feature is *gated* or *structural* — the `[features]` table
# below classifies every name, and the runner refuses a `missing-features`
# entry, a suite `requires`, or a lockfile feature tag that is not in it.
# The classification is the portability contract's enforcement
# (`wit/README.md`, "Portability contract"): an ungated runtime divergence
# may not be declared here at all — it is a defect to resolve, not a fact
# to record (AGENTS.md, "Portability: divergence is resolved, not
# accumulated"). What polices an entry differs by kind:
#
# - Gated (`chacha20-poly1305`): `@unstable` in the WIT — the consumer
#   opt-in. The guest imports the interface, so a target that lacks it
#   must still answer: the feature-tagged probes assert the correct
#   decline both ways — a target declaring it missing has to prove every
#   minting path returns `unsupported`, and `run_declined` refuses any
#   tagged probe that has no decline assertion.
# - Structural (`ecdsa-sign`): the interface is not imported at all, so
#   there is nothing to observe at runtime — a guest carrying such a probe
#   could not instantiate on a target that lacks the feature, which is why
#   the signing suite is a separate component. A target declaring it
#   missing drops the suite by declaration, and no probe can contradict
#   that. What polices it is the negative-composition gate
#   (`just conformance::class-d`), which asserts the in-guest provider does
#   not export `ecdsa-sign`.
#
# Which suites a target must produce results for is *derived*: every
# target runs every suite except those whose `requires` names a feature
# the target is missing. The runner cross-checks each results file's
# declared missing-features against this table, so a target's adapter and
# this manifest cannot drift apart silently.

[features.chacha20-poly1305]
kind = "gated"

[features.xchacha20-poly1305]
kind = "gated"

[features.sha1-checked]
kind = "gated"

[features.rsa-sign]
kind = "gated"

[features.ecdsa-sign]
kind = "structural"

[suites.shared]
# The shared conformance guest: importable against every implementation.

[suites.signing]
# The host-only signing guest. Its world imports `ecdsa-sign`, which the
# class-D policy keeps out of the in-guest provider, so a target missing
# `ecdsa-sign` cannot even link this suite's world — the requirement is
# structural, not behavioral. The gated `rsa-sign` coverage also lives
# here (the same class-D policy keeps those interfaces out of the
# provider), but as feature-tagged cases, not a `requires` entry: a target
# that links the suite may still decline RSA signing at runtime
# (jco-browser), which tags-plus-decline-probes express and a structural
# requirement cannot.
requires = ["ecdsa-sign"]

[targets.wasmtime]
# The native RustCrypto host serves everything.
missing-features = []

[targets.composed]
# The in-guest RustCrypto provider deliberately does not export
# `ecdsa-sign` (class D — see rust/guest-provider/README.md), which excludes the
# signing suite structurally. `just conformance::class-d` asserts the
# absent export, so this line cannot outlive the fact it records.
missing-features = ["ecdsa-sign"]

[targets.jco-node]
# ChaCha20-Poly1305 is feature-detected: the host serves it through the
# platform, and Node's WebCrypto implements it (experimental in Node
# 24.18+), so the target's floor is a Node whose `crypto.subtle` serves
# it. XChaCha is absent from every platform WebCrypto (and from the Modern
# Algorithms proposal), and platform SHA-1 carries no sha1dc collision
# detection (the `sha1-checked` interface). Policy and platform facts, not
# bugs: a composition needing more must supply another provider.
missing-features = ["xchacha20-poly1305", "sha1-checked"]

[targets.jco-browser]
# The same host module as jco-node, in headless Chromium — whose WebCrypto
# serves no ChaCha20-Poly1305 yet (the host feature-detects it per call, so
# no declaration lives in the module and this line follows the browser's
# capability). The host also declines the gated RSA signing mints outside
# Node by default (`rsa-sign`): a browser is an attacker-observable timing
# domain, so it fails closed unless the deployer opts in with
# `setRsaSigningPolicy("serve")` — the adapter runs the default.
missing-features = ["chacha20-poly1305", "xchacha20-poly1305", "sha1-checked", "rsa-sign"]
# Gates in CI (the Actions runner ships Chrome); locally it needs a
# Chrome/Chromium install and runs only when opted in with
# CONFORMANCE_BROWSER=1, so missing results files are warnings, not errors.
optional = true
