[package]
name = "wasmtime-demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Thin native host running the crypto-demo component over polymorph-webcrypto-wasmtime's add_to_linker."

[[bin]]
name = "wasmtime-demo-host"
path = "src/main.rs"

[dependencies]
# The `polymorph:webcrypto` host implementation lives in this crate; the binary
# obtains its imports from its `add_to_linker`.
polymorph-webcrypto-wasmtime = { path = "../../rust/wasmtime" }
wasmtime = { version = "47", features = ["component-model", "component-model-async", "async", "cranelift", "runtime"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
anyhow = "1"
