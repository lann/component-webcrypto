[package]
name = "lann-webcrypto-guest"
version = "0.1.0"
edition = "2021"
description = "Guest-side bindings and ergonomic helpers for the lann:webcrypto interfaces"

[dependencies]
# `async` pulls in the component-model `stream`/`future` runtime support and
# the `wit_stream` helpers the byte-buffer wrappers are built on.
wit-bindgen = { version = "0.59", features = ["async"] }
# `join!` runs an operation and its stream feeder concurrently within a
# single cooperative task — the core of the byte-buffer wrappers.
futures = { version = "0.3", default-features = false, features = ["async-await"] }

[lints.rust]
missing_docs = "warn"
