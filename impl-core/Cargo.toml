[package]
name = "webcrypto-impl-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared RustCrypto core for the Rust implementations of the lann:webcrypto interfaces (wasmtime-impl and guest-impl)."

[dependencies]
# RustCrypto backing implementations, declared exactly once for both Rust
# implementations so their algorithm versions and features cannot drift.
# On wasm targets `aes-gcm` selects the soft (fixsliced, table-free) AES
# backend — what makes AES-GCM acceptable in-guest; see guest-impl's README
# timing-channel classification.
sha2 = "0.10"
hmac = "0.12"
# HKDF (RFC 5869) for the derivation core.
hkdf = "0.12"
subtle = "2"
aes-gcm = "0.10"
# Zeroize the AES round-key schedule on drop (the `aes-gcm` cipher owns an
# expanded schedule; `chacha20poly1305` and the signature crates already
# zeroize their key material by default).
aes = { version = "0.8", features = ["zeroize"] }
# The general GCM path (nonces other than 96 bits, truncated tags), which
# `aes-gcm`'s type-level parameterization cannot express at runtime: GCM is
# assembled from the same primitives the crate composes — `ghash` is the
# same masked-multiply universal hash, `ctr` the same counter mode over the
# fixsliced `aes` — so the timing-channel classification is unchanged.
ghash = "0.5"
ctr = "0.9"
# The JWK carrier (import-key-jwk / export-key-jwk): JSON via `serde_json`'s
# Value (duplicate members resolve last-wins, matching the engines'
# JSON.parse semantics the WIT contract pins) and strict unpadded base64url
# via `base64` (rejects padding, non-alphabet bytes, and non-zero trailing
# bits, per RFC 7515).
serde_json = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
# Signature algorithms. The ECDSA crates back verification on every target;
# ECDSA *signing* is compiled only on non-wasm targets (class D — see
# guest-impl's README timing-channel classification).
ed25519-dalek = "2"
# X25519 agreement; static_secrets because imported/held secret keys are the
# point of the key-agreement kind (dalek gates non-ephemeral use behind it).
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
# Key and nonce generation (native OS entropy, or the target's WASI random
# backend in-guest).
getrandom = "0.3"
# Scrub raw key material on drop.
zeroize = "1"

[dev-dependencies]
# Hex constants in the known-answer tests.
hex-literal = "1"
