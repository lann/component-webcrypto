[toolchain]
# Pin the Rust toolchain so CI and contributors build with the exact same
# compiler, and so the wasm target the guest component needs is always
# available. Bump this deliberately rather than tracking floating `stable`.
channel = "1.97.0"
components = ["rustfmt", "clippy"]
targets = [
    # crypto-demo (the example guest component)
    "wasm32-unknown-unknown",
    # polymorph-webcrypto-guest-provider (the in-guest provider) and crypto-demo-driver
    "wasm32-wasip2",
]
