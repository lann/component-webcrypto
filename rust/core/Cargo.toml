[package]
name = "polymorph-webcrypto-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared RustCrypto core for the Rust implementations of the polymorph:webcrypto interfaces (polymorph-webcrypto-wasmtime and polymorph-webcrypto-guest-provider)."

[dependencies]
# RustCrypto backing implementations, declared exactly once for both Rust
# implementations so their algorithm versions and features cannot drift.
# On wasm targets `aes-gcm` selects the soft (fixsliced, table-free) AES
# backend — what makes AES-GCM acceptable in-guest; see polymorph-webcrypto-guest-provider's README
# timing-channel classification.
# `oid` gives the digests' AssociatedOid, which names the DigestInfo in
# RSASSA-PKCS1-v1_5 verification.
sha2 = { version = "0.10", features = ["oid"] }
# SHA-1 with sha1dc collision detection (the `sha1-checked` interface).
sha1-checked = "0.10"
# Plain SHA-1, used only *inside* the HMAC-family constructions
# (hmac-sha1, hkdf-sha1, pbkdf2-sha1), where collision resistance is not
# load-bearing and no digest is exposed; bare SHA-1 digests go through
# `sha1-checked` alone.
sha1 = "0.10"
hmac = "0.12"
# HKDF (RFC 5869) for the derivation core.
hkdf = "0.12"
# Constant-time byte comparison inside the general GCM path's tag check.
subtle = "2"
aes-gcm = "0.10"
# Zeroize the AES round-key schedule on drop (the `aes-gcm` cipher owns an
# expanded schedule; the signature crates already zeroize their key
# material by default).
aes = { version = "0.8", features = ["zeroize"] }
# AES-KW (RFC 3394) over the same fixsliced `aes` block cipher, for the
# `key-wrap` kind.
aes-kw = "0.2"
# AES-CBC (the `aes-cbc` interface) over the same fixsliced `aes` block
# cipher, PKCS#7 via its `block-padding` feature. AES-CTR stays local:
# the per-call 1–128-bit wrapping counter width is not expressible in the
# `ctr` crate's fixed flavors.
cbc = { version = "0.1", features = ["alloc"] }
# The general GCM path (nonces other than 96 bits, truncated tags), which
# `aes-gcm`'s type-level parameterization cannot express at runtime: GCM is
# assembled from the same primitives the crate composes — `ghash` is the
# same masked-multiply universal hash, `ctr` the same counter mode over the
# fixsliced `aes` — so the timing-channel classification is unchanged.
ghash = "0.5"
ctr = "0.9"
# The JWK carrier (import-key-jwk / export-key-jwk): JSON via `serde_json`'s
# Value (duplicate members resolve last-wins, matching the engines'
# JSON.parse semantics the WIT contract pins) and strict unpadded base64url
# via `base64ct` (rejects padding, non-alphabet bytes, and non-zero
# trailing bits, per RFC 7515) — the constant-time codec, since the members
# it carries include secret material (`k`, `d`, the RSA CRT set).
serde_json = "1"
base64ct = { version = "1", features = ["alloc"] }
# Signature algorithms. The ECDSA crates back verification on every target;
# ECDSA *signing* is compiled only on non-wasm targets (class D — see
# polymorph-webcrypto-guest-provider's README timing-channel classification).
ed25519-dalek = { version = "2", features = ["pkcs8"] }
# X25519 agreement; static_secrets because imported/held secret keys are the
# point of the key-agreement kind (dalek gates non-ephemeral use behind it).
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "ecdh"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8", "ecdh"] }
# RSA signature verification (the rsassa-pkcs1-v15-verify and rsa-pss-verify
# interfaces). Only public-key verification is invoked; the Marvin advisory
# (RUSTSEC-2023-0071) concerns the private-key operations, which this crate
# never calls.
rsa = "0.9"
# The DER carriers for the spki/pkcs8 key formats: the EC paths ride the
# curve crates' own encoders, while the RFC 8410 forms (Ed25519, X25519)
# are assembled here — the crates' exports write v2 keypairs, and the
# interchange form every platform accepts is v1.
pkcs8 = { version = "0.10", features = ["alloc"] }
spki = { version = "0.7", features = ["alloc"] }
der = { version = "0.7", features = ["alloc"] }
# Key and nonce generation (native OS entropy, or the target's WASI random
# backend in-guest).
getrandom = "0.3"
# Scrub raw key material on drop.
zeroize = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# RSA private-key operations (the rsa-sign gate), native targets only.
# BoringSSL lineage — the one implementation family with a verified
# negative result under the Marvin timing methodology; RUSTSEC-2023-0071
# (key recovery via timing) keeps the pure-Rust `rsa` crate off the
# signing path, where it remains verification-only. See `wit/README.md`,
# "Design notes", the lineage-pin ruling.
aws-lc-rs = "1"

[dev-dependencies]
# Hex constants in the known-answer tests, decoded at compile time; the
# vectors whose hex arrives as a `&str` go through `data-encoding`.
data-encoding = "2"
data-encoding-macro = "0.1"
