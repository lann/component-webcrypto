[package]
name = "polymorph-webcrypto-guest-provider"
version = "0.1.0"
edition = "2021"
publish = false
description = "In-guest wasm component implementation of the polymorph:webcrypto interfaces, backed by RustCrypto; exports the package surface for composition via `wac plug`."

[lib]
crate-type = ["cdylib"]

[dependencies]
# `async` pulls in the component-model `stream`/`future` runtime support and
# the `wit_stream` helpers; `async-spawn` provides `wit_bindgen::spawn`, used
# to feed returned byte streams after an export has returned.
wit-bindgen = { version = "0.59", features = ["async", "async-spawn"] }
# The cryptography itself, shared verbatim with the Wasmtime host. On this
# wasm target the core selects the soft (fixsliced, table-free) AES backend
# — what makes AES-GCM acceptable in-guest (see the README's timing-channel
# classification) — and compiles no ECDSA signing code (class D).
polymorph-webcrypto-core = { path = "../core" }
