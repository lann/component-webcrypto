[package]
name = "lann-webcrypto-guest"
version = "0.1.0"
edition = "2021"
publish = false
description = "Guest-side bindings and ergonomic helpers for the lann:webcrypto interfaces"

[features]
# `DataSource::from_buf`: feed an operation from any `bytes::Buf`.
bytes = ["dep:bytes"]
# `DataSource::from_reader`: feed an operation from any
# `futures_io::AsyncRead`.
futures-io = ["dep:futures-io"]
# The `@unstable`-gated ChaCha interfaces (`chacha20-poly1305`,
# `xchacha20-poly1305`, `xchacha20-poly1305-internal-nonce` — see
# wit/README.md, "Stability gates"). Off by default: enabling it adds the
# three imports to the generated world, so every composition of a consumer
# component must then provide them.
chacha = []
# The `@unstable`-gated `sha1-checked` interface (see wit/README.md,
# "Stability gates"). Off by default, like `chacha`: enabling it adds the
# import to the generated world, and platform-backed providers cannot
# serve it.
sha1-checked = []
# The `@unstable`-gated RSA signing interfaces (`rsassa-pkcs1-v15-sign`,
# `rsa-pss-sign` — see wit/README.md, "Stability gates"). Off by default,
# like `chacha`: enabling it adds the two imports to the generated world,
# and providers in attacker-observable timing domains do not serve them
# (see wit/README.md, "Timing-channel policy"), so the composed in-guest
# target cannot run a consumer that enables this.
rsa-sign = []
# The `@unstable`-gated `rsa-oaep-decrypt` interface (see wit/README.md,
# "Stability gates"). Off by default, like `rsa-sign` and for the same
# reason: enabling it adds the import to the generated world, and
# providers in attacker-observable timing domains do not serve RSA
# private-key operations (see wit/README.md, "Timing-channel policy"), so
# the composed in-guest target cannot run a consumer that enables this.
rsa-oaep-decrypt = []

[dependencies]
# `async` pulls in the component-model `stream`/`future` runtime support and
# the `wit_stream` helpers the byte-buffer wrappers are built on.
wit-bindgen = { version = "0.59", features = ["async"] }
# `join!` runs an operation and its stream feeder concurrently within a
# single cooperative task — the core of the byte-buffer wrappers.
futures = { version = "0.3", default-features = false, features = ["async-await"] }
bytes = { version = "1", optional = true, default-features = false }
futures-io = { version = "0.3", optional = true }

[lints.rust]
missing_docs = "warn"
