[package]
name = "wasmtime-webcrypto"
version = "0.1.0"
edition = "2021"
publish = false
description = "Wasmtime host implementation of the lann:webcrypto interfaces, backed by RustCrypto."

[dependencies]
# Wasmtime with component-model async (streams/futures) support. The
# `component-model-async` feature gates the host `StreamReader`/`StreamProducer`
# API used here.
wasmtime = { version = "47", features = ["component-model", "component-model-async", "async", "runtime"] }
futures = "0.3"
anyhow = "1"
# RustCrypto: the incremental HMAC-SHA-256 and one-shot AES-256-GCM
# implementations backing the resources.
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
aes-gcm = "0.10"
# Zeroize the AES round-key schedule on drop (the `aes-gcm` cipher owns an
# expanded schedule; `chacha20poly1305` and the signature crates already
# zeroize their key material by default).
aes = { version = "0.8", features = ["zeroize"] }
chacha20poly1305 = "0.10"
# Signature algorithms.
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
# Key generation.
getrandom = "0.3"
# Scrub raw key material on drop.
zeroize = "1"

