[package]
name = "wasmtime-webcrypto"
version = "0.1.0"
edition = "2021"
publish = false
description = "Wasmtime host implementation of the lann:webcrypto interfaces, backed by RustCrypto."

[dependencies]
# Wasmtime with component-model async (streams/futures) support. The
# `component-model-async` feature gates the host `StreamReader`/`StreamProducer`
# API used here.
wasmtime = { version = "47", features = ["component-model", "component-model-async", "async", "runtime"] }
futures = "0.3"
# The cryptography itself, shared verbatim with the in-guest provider.
webcrypto-impl-core = { path = "../impl-core" }

